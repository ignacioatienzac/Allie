<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Español: Allie</title>
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #50E3C2;
            --bg: #F4F7F6;
            --text: #2C3E50;
            --correct: #27ae60;
            --wrong: #e74c3c;
            --highlight: #f1c40f;
        }

        body {
            font-family: 'Verdana', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2 { color: var(--primary); text-align: center; margin-bottom: 10px; }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        /* --- FLASHCARDS --- */
        .flashcard-container {
            perspective: 1000px;
            height: 180px;
            margin: 20px 0;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4em;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .flashcard.flipped { transform: rotateY(180deg); }

        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            padding: 15px;
            box-sizing: border-box;
        }

        .front { background-color: var(--primary); color: white; }
        .back { background-color: white; color: var(--text); border: 2px solid var(--primary); transform: rotateY(180deg); }

        /* --- JUEGO PASO 2: DETECCIÓN --- */
        .sentence-block {
            background: #fff;
            border-left: 5px solid var(--primary);
            padding: 15px;
            margin-bottom: 15px;
            font-size: 1.1em;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .word {
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 2px;
            transition: background 0.2s;
            display: inline-block;
        }

        .word:hover { background-color: #eee; }
        .word.selected { background-color: var(--highlight); color: #333; }
        
        /* Estados de validación */
        .word.status-correct { background-color: var(--correct); color: white; cursor: default; }
        .word.status-wrong { background-color: var(--wrong); color: white; text-decoration: line-through; }

        /* --- JUEGO PASO 3: CORRECCIÓN --- */
        #step3-area { display: none; animation: fadeIn 0.5s; }
        
        .correction-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .error-label {
            color: var(--wrong);
            font-weight: bold;
            text-decoration: line-through;
            width: 40%;
        }

        .correction-input {
            width: 50%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .correction-input.valid { border-color: var(--correct); background-color: #e8f8f5; }
        .correction-input.invalid { border-color: var(--wrong); background-color: #fce4ec; }

        /* --- BOTONES Y FEEDBACK --- */
        .controls { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            background-color: var(--primary);
            color: white;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: transform 0.2s, background 0.3s;
        }

        button:hover { transform: translateY(-2px); filter: brightness(1.1); }
        button:disabled { background-color: #ccc; cursor: not-allowed; transform: none; }
        
        .feedback-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .feedback-box.error { background-color: #fadbd8; color: #c0392b; }
        .feedback-box.success { background-color: #d1f2eb; color: #27ae60; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <h1>🇪🇸 Misión: Corrección de Errores</h1>
    
    <div class="container">
        <h2>1. Repaso Rápido</h2>
        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="flashcard">
                <div class="front">
                    <p id="fc-front">Cargando...</p>
                </div>
                <div class="back">
                    <strong id="fc-back">...</strong>
                    <p id="fc-expl" style="font-size: 0.9em; margin-top: 10px;"></p>
                </div>
            </div>
        </div>
        <div class="controls">
            <button onclick="prevCard()">Anterior</button>
            <button onclick="nextCard()">Siguiente</button>
        </div>
    </div>

    <div class="container" id="game-container">
        
        <div id="step2-area">
            <h2>2. Encuentra los errores</h2>
            <p>Hay 4 frases abajo. Haz clic sobre <strong>todas</strong> las palabras incorrectas.</p>
            
            <div id="sentences-wrapper">
                </div>

            <div class="feedback-box" id="step2-feedback"></div>

            <div class="controls">
                <button id="btn-check-step2" onclick="checkStep2()">Comprobar Selección</button>
            </div>
        </div>

        <div id="step3-area">
            <h2>3. ¡Ahora corrígelos!</h2>
            <p>Escribe la forma correcta de los errores que encontraste.</p>

            <div id="correction-list">
                </div>

            <div class="feedback-box" id="step3-feedback"></div>

            <div class="controls">
                <button id="btn-check-step3" onclick="checkStep3()">Validar Correcciones</button>
                <button id="btn-restart" onclick="startNewRound()" style="display:none; background-color: var(--secondary);">🔄 Jugar otra ronda (Nuevas frases)</button>
            </div>
        </div>

    </div>

    <script>
        // --- DATA MANAGEMENT ---
        let gameData = {};
        // Fallback en caso de error CORS local
        const fallbackData = {
            "flashcards": [
                {"id":1, "error":"Estioma Carlos", "correction":"Estimado Carlos", "explanation":"Saludo formal."},
                {"id":2, "error":"Hace mucho caro", "correction":"Hace mucho calor", "explanation":"Confusión Caro/Calor"},
                {"id":3, "error":"Voy comer", "correction":"Voy a comer", "explanation":"Falta 'a'"},
                {"id":4, "error":"Manayunda", "correction":"Mañana", "explanation":"Palabra inventada"}
            ],
            "sentences": [
                { "id":1, "content": "Estioma amigo, hoy voy escriber una carta.", "errors": [{"word":"Estioma", "correction":"Estimado"}, {"word":"escriber", "correction":"escribir"}] },
                { "id":2, "content": "En Vietnam hace mucho caro en verano.", "errors": [{"word":"caro", "correction":"calor"}] },
                { "id":3, "content": "Llevo una camiseta de manga carto azul.", "errors": [{"word":"carto", "correction":"corta"}] },
                { "id":4, "content": "Por la manayunda me lavanto a las ocho.", "errors": [{"word":"manayunda", "correction":"mañana"}, {"word":"lavanto", "correction":"levanto"}] },
                { "id":5, "content": "Despuesto del desayuno voy ver un museo.", "errors": [{"word":"Despuesto", "correction":"Después"}, {"word":"ver", "correction":"a ver"}] },
                { "id":6, "content": "Llevo un bolso gante para comprender.", "errors": [{"word":"gante", "correction":"grande"}, {"word":"comprender", "correction":"comprar"}] }
            ]
        };

        let currentBatch = []; // Las 4 frases actuales
        let foundErrors = [];  // Los errores encontrados por el usuario para pasar al paso 3

        async function loadData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error("Error loading JSON");
                gameData = await response.json();
            } catch (e) {
                console.log("Usando datos de respaldo (Fallback)");
                gameData = fallbackData;
            }
            initFlashcards();
            startNewRound();
        }

        window.onload = loadData;

        // --- FLASHCARDS LOGIC (Simple) ---
        let currentCard = 0;
        function initFlashcards() { renderCard(); }
        function renderCard() {
            const card = gameData.flashcards[currentCard];
            document.getElementById('fc-front').textContent = card.error;
            document.getElementById('fc-back').textContent = card.correction;
            document.getElementById('fc-expl').textContent = card.explanation;
            document.getElementById('flashcard').classList.remove('flipped');
        }
        function flipCard() { document.getElementById('flashcard').classList.toggle('flipped'); }
        function nextCard() { currentCard = (currentCard + 1) % gameData.flashcards.length; renderCard(); }
        function prevCard() { currentCard = (currentCard - 1 + gameData.flashcards.length) % gameData.flashcards.length; renderCard(); }

        // --- GAME LOGIC ---

        function startNewRound() {
            // Reset UI
            document.getElementById('step2-area').style.display = 'block';
            document.getElementById('step3-area').style.display = 'none';
            document.getElementById('btn-check-step2').disabled = false;
            document.getElementById('step2-feedback').style.display = 'none';
            document.getElementById('btn-restart').style.display = 'none';
            document.getElementById('btn-check-step3').style.display = 'inline-block';
            foundErrors = [];

            // 1. Pick 4 random sentences
            const allSentences = gameData.sentences;
            // Shuffle array safely
            const shuffled = [...allSentences].sort(() => 0.5 - Math.random());
            currentBatch = shuffled.slice(0, 4);

            // 2. Render Step 2
            const wrapper = document.getElementById('sentences-wrapper');
            wrapper.innerHTML = '';

            currentBatch.forEach(sentenceObj => {
                const div = document.createElement('div');
                div.className = 'sentence-block';
                
                // Split words strictly by spaces (simple for A1)
                const words = sentenceObj.content.split(' ');
                
                words.forEach(word => {
                    const span = document.createElement('span');
                    span.textContent = word;
                    span.className = 'word';
                    // Store clean word for checking (remove punctuation)
                    span.dataset.clean = word.replace(/[.,;]/g, '').toLowerCase();
                    span.onclick = () => toggleSelect(span);
                    div.appendChild(span);
                });

                wrapper.appendChild(div);
            });
        }

        function toggleSelect(span) {
            if (span.classList.contains('status-correct')) return; // Bloquear si ya está validado
            span.classList.toggle('selected');
        }

        function checkStep2() {
            const feedback = document.getElementById('step2-feedback');
            const selectedSpans = document.querySelectorAll('.word.selected');
            
            // Collect all actual errors in current batch for validation
            let allErrorsInBatch = [];
            currentBatch.forEach(s => {
                s.errors.forEach(e => allErrorsInBatch.push(e));
            });

            let correctCount = 0;
            let wrongSelectionCount = 0;
            let errorsToCorrectNext = [];

            // Check User Selections
            selectedSpans.forEach(span => {
                const cleanWord = span.dataset.clean;
                
                // Check if this word is in the error list for the batch
                // Note: Simple check. If word 'la' appears twice and one is error, this might flag both.
                // For this A1 specific text, unique error words are assumed or context isn't checked deeply.
                const match = allErrorsInBatch.find(e => e.word.toLowerCase() === cleanWord);

                if (match) {
                    span.classList.remove('selected');
                    span.classList.add('status-correct'); // Green
                    correctCount++;
                    // Add to list for Step 3 if not added already
                    if (!errorsToCorrectNext.some(e => e.word === match.word && e.correction === match.correction)) {
                        errorsToCorrectNext.push(match);
                    }
                } else {
                    span.classList.remove('selected');
                    span.classList.add('status-wrong'); // Red (strike)
                    // Auto-remove red status after 1 sec to let them try again? 
                    // Or keep it. Let's keep it but allow re-clicking to remove class if needed, 
                    // but simplest is just show it's wrong.
                    setTimeout(() => span.classList.remove('status-wrong'), 1500);
                    wrongSelectionCount++;
                }
            });

            // Validation Logic
            const totalErrors = allErrorsInBatch.length;

            if (wrongSelectionCount > 0) {
                feedback.textContent = `Has marcado ${wrongSelectionCount} palabras que son correctas. Inténtalo de nuevo.`;
                feedback.className = 'feedback-box error';
                feedback.style.display = 'block';
            } else if (correctCount < totalErrors) {
                feedback.textContent = `Has encontrado ${correctCount} de ${totalErrors} errores. ¡Faltan algunos!`;
                feedback.className = 'feedback-box error';
                feedback.style.display = 'block';
            } else {
                // Success!
                feedback.textContent = "¡Genial! Has encontrado todos los errores.";
                feedback.className = 'feedback-box success';
                feedback.style.display = 'block';
                document.getElementById('btn-check-step2').disabled = true;
                
                // Save errors for Step 3
                foundErrors = errorsToCorrectNext;
                
                // Trigger Step 3 after short delay
                setTimeout(initStep3, 1000);
            }
        }

        function initStep3() {
            document.getElementById('step2-area').style.display = 'none';
            const step3 = document.getElementById('step3-area');
            const list = document.getElementById('correction-list');
            const feedback = document.getElementById('step3-feedback');
            
            step3.style.display = 'block';
            feedback.style.display = 'none';
            list.innerHTML = '';

            if (foundErrors.length === 0) {
                list.innerHTML = "<p>¡Qué raro! No había errores.</p>";
                return;
            }

            foundErrors.forEach((err, index) => {
                const item = document.createElement('div');
                item.className = 'correction-item';
                
                const label = document.createElement('div');
                label.className = 'error-label';
                label.textContent = err.word;

                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'correction-input';
                input.placeholder = 'Escribe la corrección';
                input.dataset.correctAnswer = err.correction;

                item.appendChild(label);
                item.appendChild(input);
                list.appendChild(item);
            });
        }

        function checkStep3() {
            const inputs = document.querySelectorAll('.correction-input');
            let allCorrect = true;

            inputs.forEach(input => {
                const answer = input.value.trim().toLowerCase();
                const target = input.dataset.correctAnswer.toLowerCase();

                if (answer === target) {
                    input.classList.remove('invalid');
                    input.classList.add('valid');
                    input.disabled = true;
                } else {
                    input.classList.add('invalid');
                    allCorrect = false;
                }
            });

            const feedback = document.getElementById('step3-feedback');
            if (allCorrect) {
                feedback.textContent = "¡Excelente! Todo corregido.";
                feedback.className = 'feedback-box success';
                feedback.style.display = 'block';
                
                // Show Restart Button
                document.getElementById('btn-check-step3').style.display = 'none';
                document.getElementById('btn-restart').style.display = 'inline-block';
            } else {
                feedback.textContent = "Hay errores en tus correcciones. Revisa los cuadros rojos.";
                feedback.className = 'feedback-box error';
                feedback.style.display = 'block';
            }
        }

    </script>
</body>
</html>
